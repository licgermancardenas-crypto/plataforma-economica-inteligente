# Tema del dashboard — paleta sobria y accesible (validada contra daltonismo).
[theme]
primaryColor = "#1f4e79"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f4f6f8"
textColor = "#1a1a1a"
font = "sans serif"

[server]
headless = true

[browser]
gatherUsageStats = false

# TEMPORAL (diagnóstico): mostrar el traceback completo en el navegador en vez
# del mensaje redactado de Streamlit Cloud. Revertir una vez identificado el fallo.
[client]
showErrorDetails = "full"
